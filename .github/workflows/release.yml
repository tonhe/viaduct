name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    needs: release
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            inno_arch: x64compatible
          - goarch: arm64
            inno_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "viaduct_${version}_windows_${{ matrix.goarch }}.zip"
          gh release download "${{ github.ref_name }}" --pattern "$zip" --repo "${{ github.repository }}"
          Expand-Archive -Path "$zip" -DestinationPath staging

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $sourcedir = (Resolve-Path staging).Path
          $outdir = (Get-Location).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="$version" `
            /DMyAppArch="${{ matrix.goarch }}" `
            /DInnoArch="${{ matrix.inno_arch }}" `
            /DSourceDir="$sourcedir" `
            /DOutputPath="$outdir" `
            ".github\installer\windows\via.iss"

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $installer = "via_${version}_windows_${{ matrix.goarch }}_installer.exe"
          gh release upload "${{ github.ref_name }}" "$installer" --repo "${{ github.repository }}"

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: tonhe
          repositories: homebrew-tap

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: tonhe/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}

      - name: Update viaduct formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL_URL="https://github.com/tonhe/viaduct/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"

          # Download tarball with retry to avoid race with release job
          for i in 1 2 3; do
            curl -fsSL -o tarball.tar.gz "$TARBALL_URL" && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          SHA256=$(shasum -a 256 tarball.tar.gz | cut -d' ' -f1)
          rm -f tarball.tar.gz

          cat > Formula/viaduct.rb << FORMULA
          class Viaduct < Formula
            desc "Modern traceroute with real-time terminal UI"
            homepage "https://github.com/tonhe/viaduct"
            url "$TARBALL_URL"
            sha256 "$SHA256"
            license "MIT"

            depends_on "go" => :build

            def install
              ldflags = %W[
                -s -w
                -X main.version=#{version}
                -X main.buildVersion=#{tap.user}
              ]
              system "go", "build", *std_go_args(ldflags:, output: bin/"via"), "./cmd/via"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/via --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/viaduct.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/viaduct.rb
          git commit -m "viaduct: update to ${VERSION}"
          git push
