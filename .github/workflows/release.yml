name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Requires your approval in Settings > Environments > release. The agent's PAT
    # has no Deployments permission, so it cannot approve a release.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Nothing is published by this step: it builds one linux/amd64 binary
      # into dist/ from the same .goreleaser.yml (same ldflags, same commit)
      # as the release below. No token is passed to it.
      # GoReleaser is pinned to an exact version, the same in both steps.
      # Upgrading it is a deliberate change to both lines.
      - name: Build one binary to check the version
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "v2.20.3"
          args: build --single-target --clean
        env:
          GOOS: linux
          GOARCH: amd64

      # The tag is the only source of the version. `via --version` prints
      # "via version <version> (build <commit>)"; <version> must be exactly
      # the tag without its leading "v". If it is not, fail here, before the
      # release step: no release, archive or tap update exists yet, and the
      # installer and Homebrew jobs need this job and will not run.
      - name: Check the built binary reports the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          bin=$(find dist -type f -name via -path '*linux_amd64*' | head -n 1)
          if [ -z "$bin" ]; then
            echo "::error::no linux/amd64 binary found under dist/"
            exit 1
          fi
          out=$("$bin" --version)
          echo "$bin reports: $out"
          got=$(printf '%s\n' "$out" | awk 'NR == 1 { print $3 }')
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::the built binary reports version '$got', the tag's version is '$want'; nothing was published"
            exit 1
          fi
          echo "version '$got' matches tag '$TAG'"

      # Only reached when the check above passed. --clean removes the dist/
      # the check build left behind (dist/ is in .gitignore, so the tree is
      # not dirty).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "v2.20.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    needs: release
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            inno_arch: x64compatible
          - goarch: arm64
            inno_arch: arm64
    # The tag, the repository and the matrix values reach the PowerShell
    # scripts as environment variables, never as text pasted into the script.
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      ARCH: ${{ matrix.goarch }}
      INNO_ARCH: ${{ matrix.inno_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:TAG.TrimStart("v")
          $zip = "viaduct_${version}_windows_$($env:ARCH).zip"
          $url = "https://github.com/$($env:REPO)/releases/download/$($env:TAG)/$zip"
          gh release download "$env:TAG" --pattern "$zip" --repo "$env:REPO"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $zip)) {
            Write-Output "::error::could not download $url"
            exit 1
          }
          Expand-Archive -Path "$zip" -DestinationPath staging

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          $version = $env:TAG.TrimStart("v")
          $sourcedir = (Resolve-Path staging).Path
          $outdir = (Get-Location).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="$version" `
            /DMyAppArch="$env:ARCH" `
            /DInnoArch="$env:INNO_ARCH" `
            /DSourceDir="$sourcedir" `
            /DOutputPath="$outdir" `
            ".github\installer\windows\via.iss"

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:TAG.TrimStart("v")
          $installer = "via_${version}_windows_$($env:ARCH)_installer.exe"
          gh release upload "$env:TAG" "$installer" --repo "$env:REPO"

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: tonhe
          repositories: homebrew-tap

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: tonhe/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}

      - name: Update viaduct formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL_URL="https://github.com/tonhe/viaduct/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"

          # Download tarball with retry to avoid race with release job.
          # If every attempt fails, stop here and name the URL, before the
          # checksum of a file that does not exist.
          downloaded=0
          for i in 1 2 3; do
            if curl -fsSL -o tarball.tar.gz "$TARBALL_URL"; then
              downloaded=1
              break
            fi
            echo "Attempt $i failed"
            if [ "$i" -lt 3 ]; then
              echo "retrying in 10s..."
              sleep 10
            fi
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "::error::could not download $TARBALL_URL after 3 attempts"
            exit 1
          fi

          SHA256=$(shasum -a 256 tarball.tar.gz | cut -d' ' -f1)
          rm -f tarball.tar.gz

          cat > Formula/viaduct.rb << FORMULA
          class Viaduct < Formula
            desc "Modern traceroute with real-time terminal UI"
            homepage "https://github.com/tonhe/viaduct"
            url "$TARBALL_URL"
            sha256 "$SHA256"
            license "MIT"

            depends_on "go" => :build

            def install
              ldflags = %W[
                -s -w
                -X main.version=#{version}
                -X main.buildVersion=#{tap.user}
              ]
              system "go", "build", *std_go_args(ldflags:, output: bin/"via"), "./cmd/via"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/via --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/viaduct.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/viaduct.rb
          git commit -m "viaduct: update to ${VERSION}"
          git push
