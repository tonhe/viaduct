name: Fuzz (weekly)

on:
  schedule:
    - cron: '0 9 * * MON'  # Monday 09:00 UTC
  workflow_dispatch: {}    # allow manual trigger

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {pkg: ./internal/probe, name: FuzzParseInnerHeader}
          - {pkg: ./internal/probe, name: FuzzTransportOffset}
          - {pkg: ./internal/probe, name: FuzzTCPChecksum}
          - {pkg: ./internal/probe, name: FuzzParseTCPResponse}
          - {pkg: ./internal/asn,   name: FuzzParseOriginResponse}
          - {pkg: ./internal/asn,   name: FuzzParseASNameResponse}
          - {pkg: ./internal/config, name: FuzzLoad}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      - name: Fuzz ${{ matrix.target.name }}
        shell: bash
        env:
          FUZZ_TARGET: ${{ matrix.target.name }}
          FUZZ_PKG: ${{ matrix.target.pkg }}
        run: go test -run '^$' -fuzz="$FUZZ_TARGET" -fuzztime=5m "$FUZZ_PKG"
      - name: Upload crash corpus (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target.name }}
          path: ${{ matrix.target.pkg }}/testdata/fuzz/
