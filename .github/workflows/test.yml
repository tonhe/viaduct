name: Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.6']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        shell: bash
        run: go build ./...
      - name: Test (race)
        shell: bash
        run: go test -race ./...
      - name: Test (coverage)
        shell: bash
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage gate
        shell: bash
        run: bash scripts/check-coverage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
