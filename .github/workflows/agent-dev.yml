# Dev agent: nightly on agent:ready issues, on demand, or when you label an issue agent:urgent.
#   One issue now:         gh workflow run agent-dev.yml -f issue=42
#   The nightly selection: gh workflow run agent-dev.yml -f mode=scheduled
# There is no schedule here: GitHub started this repo's scheduled runs hours late or dropped
# them (#121). An outside scheduler starts the nightly selection with the second command.
name: agent-dev
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scheduled = the nightly selection; manual and urgent need an issue number"
        type: choice
        options: [manual, scheduled, urgent]
        default: manual
      issue: {description: "Issue number (manual and urgent only)", required: false}
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: read
# Label events other than agent:urgent get their own throwaway group, so they can never
# displace a queued nightly or urgent run.
concurrency:
  group: ${{ (github.event_name == 'issues' && github.event.label.name != 'agent:urgent') && format('agent-dev-noop-{0}', github.run_id) || 'agent-dev' }}
  cancel-in-progress: false
jobs:
  dev:
    if: github.event_name != 'issues' || github.event.label.name == 'agent:urgent'
    uses: tonhe/agent-loop/.github/workflows/dev.yml@v1
    with:
      loop_ref: v1
      # A label event is always urgent; a dispatch runs in the mode it names. The nightly
      # selection ignores any issue number.
      mode: ${{ github.event_name == 'issues' && 'urgent' || github.event.inputs.mode || 'manual' }}
      issue: ${{ github.event.inputs.mode != 'scheduled' && (github.event.inputs.issue || github.event.issue.number) || '' }}
      owner_login: tonhe
      git_author_name: tonhe
      git_author_email: a.mattke@gmail.com
      verify_command: make test-all
      go_version_file: go.mod
      bash_allow: >-
        Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(gofmt:*),Bash(go mod tidy),
        Bash(go mod tidy -diff),
        Bash(make build),Bash(make test),Bash(make test-race),Bash(make test-tui),
        Bash(make test-all),Bash(make coverage-gate),Bash(make golden-update),
        Bash(make lint),Bash(make lab-docker)
      # Scheduled runs take bugs first, then tech debt, then upkeep, then features;
      # oldest first within each. Milestones rank above this.
      selection_order: type
      protected_paths: |
        Makefile
        scripts/
        .goreleaser.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
