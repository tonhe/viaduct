# Nightly backlog triage. Logic lives in tonhe/agent-loop.
#   Start it: gh workflow run agent-backlog.yml
# There is no schedule here: GitHub started this repo's scheduled runs hours late or dropped
# them (#121). An outside scheduler starts it, before agent-dev.
name: agent-backlog
on:
  workflow_dispatch:
    inputs:
      dry_run: {type: boolean, default: false, description: "Plan only, change nothing"}
permissions:
  contents: read
  issues: read
concurrency: {group: agent-backlog, cancel-in-progress: false}
jobs:
  backlog:
    uses: tonhe/agent-loop/.github/workflows/backlog.yml@v1
    with:
      loop_ref: v1
      owner_login: tonhe
      verify_command: make test-all
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
